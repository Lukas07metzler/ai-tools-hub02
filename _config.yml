title: "SmartAI Picks"
description: "Honest reviews and comparisons of the best AI tools for productivity, writing, and business."
baseurl: "/ai-tools-hub02"
url: "https://lukas07metzler.github.io"
author: "SmartAI Picks"
lang: en

# Replace with your repo name if using project pages (e.g. /ai-tools-hub)
# baseurl: "/ai-tools-hub"

timezone: Europe/Berlin

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Exclude from build
exclude:
  - scripts/
  - requirements.txt
  - SETUP.md
  - "*.py"
  - Gemfile
  - Gemfile.lock
  - .github/

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: SmartAI Picks

# Feed
feed:
  path: feed.xml
