name: Generate Blog Post

on:
  schedule:
    # Mon, Wed, Fri at 8:00 AM UTC
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force generation even if keywords are low"
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and push new post
        run: |
          git config user.name "SmartAI Content Bot"
          git config user.email "bot@smartaipicks.com"
          git add _posts/ scripts/niche_strategy.json
          if git diff --staged --quiet; then
            echo "No new content to commit."
          else
            git commit -m "post: auto-generate $(date +%Y-%m-%d)"
            git push
          fi
