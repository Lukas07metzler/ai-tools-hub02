name: Weekly Strategy Update

on:
  schedule:
    # Every Sunday at 7:00 AM UTC
    - cron: "0 7 * * 0"
  workflow_dispatch: {}

jobs:
  update-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy update agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/update_strategy.py

      - name: Commit updated strategy
        run: |
          git config user.name "SmartAI Strategy Bot"
          git config user.email "bot@smartaipicks.com"
          git add scripts/niche_strategy.json
          if git diff --staged --quiet; then
            echo "No strategy changes."
          else
            git commit -m "strategy: weekly keyword refresh $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
